<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">Architecture overview showing the browser UI, Express server and routes, library modules, configuration and JSON data, with a numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
      .section{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#475569}
      .label{font-size:14px;font-weight:700}.body{font-size:12px}.small{font-size:12px;fill:#475569}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.soft{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.ticketText{fill:#9a3412}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 4}
      .n{fill:#2563eb;stroke:#fff;stroke-width:2}.ntext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="40" class="title">ShopLedger · application architecture</text>
  <text x="32" y="64" class="subtitle">Express POS, Khata ledger and GST invoicing · verified module names from the repository</text>

  <!-- Browser UI -->
  <text x="32" y="105" class="section">BROWSER UI</text>
  <rect x="32" y="118" width="180" height="128" rx="10" class="box"/>
  <text x="48" y="145" class="label">public/</text>
  <text x="48" y="168" class="body">index.html</text>
  <text x="48" y="188" class="body">js/app.js</text>
  <text x="48" y="208" class="body">css/style.css</text>
  <text x="48" y="231" class="small">POS · orders · Khata · reports</text>

  <!-- Server -->
  <text x="250" y="105" class="section">HTTP APP</text>
  <rect x="250" y="118" width="200" height="128" rx="10" class="box"/>
  <text x="268" y="147" class="label">server.js</text>
  <text x="268" y="170" class="body">Express app · JSON parser</text>
  <text x="268" y="190" class="body">static public/ · mounts routers</text>
  <text x="268" y="214" class="body">GET /orders/:id/invoice</text>
  <text x="268" y="234" class="small">invoice.render(order)</text>
  <path d="M212 180 H250" class="link"/>

  <!-- Routers -->
  <text x="490" y="105" class="section">ROUTES · mounted at /api</text>
  <rect x="490" y="118" width="200" height="54" rx="8" class="box"/>
  <text x="505" y="141" class="label">routes/products.js</text><text x="505" y="160" class="small">products · coupons</text>
  <rect x="490" y="181" width="200" height="58" rx="8" class="box"/>
  <text x="505" y="204" class="label">routes/orders.js</text><text x="505" y="224" class="small">GET/POST orders · cancel</text>
  <rect x="490" y="248" width="200" height="54" rx="8" class="box"/>
  <text x="505" y="271" class="label">routes/customers.js</text><text x="505" y="290" class="small">customers · settlements</text>
  <rect x="490" y="311" width="200" height="66" rx="8" class="box"/>
  <text x="505" y="334" class="label">routes/reports.js</text><text x="505" y="354" class="small">reports · pricing preview</text><text x="505" y="371" class="small">admin export</text>
  <path d="M450 150 H470 V147 H490" class="link"/>
  <path d="M450 174 H470 V210 H490" class="flow"/>
  <path d="M450 194 H476 V275 H490" class="link"/>
  <path d="M450 215 H482 V344 H490" class="link"/>

  <!-- Libs -->
  <text x="738" y="105" class="section">LIB MODULES</text>
  <rect x="738" y="118" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="140" class="label">lib/store.js</text><text x="753" y="158" class="small">read · write · appendAudit</text>
  <rect x="738" y="175" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="197" class="label">lib/orders.js</text><text x="753" y="215" class="small">add · get · list · cancel</text>
  <rect x="738" y="232" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="254" class="label">lib/inventory.js</text><text x="753" y="272" class="small">find · check · reserve · release</text>
  <rect x="738" y="289" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="311" class="label">lib/ledger.js</text><text x="753" y="329" class="small">Khata · customer · settlement</text>
  <rect x="738" y="346" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="368" class="label">lib/pricing.js</text><text x="753" y="386" class="small">subtotal · computeTotals</text>
  <rect x="738" y="403" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="425" class="label">lib/coupons.js</text><text x="753" y="443" class="small">normalizeCode · validate · discount</text>
  <rect x="738" y="460" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="482" class="label">lib/dates.js</text><text x="753" y="500" class="small">today · date keys · fiscal year</text>
  <rect x="738" y="517" width="215" height="48" rx="8" class="box"/>
  <text x="753" y="539" class="label">lib/reports.js</text><text x="753" y="557" class="small">dashboard · GST reconciliation</text>
  <rect x="738" y="574" width="215" height="54" rx="8" class="ticket"/>
  <text x="753" y="597" class="label ticketText">lib/invoice.js · TICKET</text><text x="753" y="617" class="small ticketText">computeInvoiceFigures · render</text>
  <rect x="738" y="637" width="215" height="48" rx="8" class="ticket"/>
  <text x="753" y="659" class="label ticketText">lib/tax.js · TICKET</text><text x="753" y="677" class="small ticketText">GST rate · CGST/SGST split</text>

  <!-- Config and data -->
  <text x="990" y="105" class="section">SETTINGS &amp; STORAGE</text>
  <rect x="990" y="118" width="180" height="100" rx="10" class="soft"/>
  <text x="1006" y="147" class="label">config.js</text>
  <text x="1006" y="169" class="body">shop · tax slabs</text>
  <text x="1006" y="190" class="body">coupons · inventory</text>
  <rect x="990" y="250" width="180" height="115" rx="10" class="soft"/>
  <text x="1006" y="280" class="label">data/db.json</text>
  <text x="1006" y="302" class="body">products · customers</text>
  <text x="1006" y="323" class="body">orders · settlements</text>
  <text x="1006" y="344" class="body">auditLog · ID counters</text>

  <!-- Numbered order flow -->
  <rect x="32" y="278" width="658" height="407" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="52" y="310" class="section" fill="#1d4ed8">ORDER PLACEMENT · POST /api/orders</text>
  <text x="52" y="336" class="small">Flow numbered in execution order; storage happens after the in-memory order/ledger/inventory updates.</text>

  <circle cx="65" cy="378" r="13" class="n"/><text x="65" y="378" class="ntext">1</text>
  <rect x="88" y="356" width="245" height="48" rx="8" class="box"/>
  <text x="103" y="378" class="label">routes/orders.js</text><text x="103" y="396" class="small">resolve products · parse quantities</text>
  <path d="M333 380 H377" class="flow"/>
  <circle cx="395" cy="380" r="13" class="n"/><text x="395" y="380" class="ntext">2</text>
  <rect x="418" y="356" width="245" height="48" rx="8" class="box"/>
  <text x="433" y="378" class="label">inventory.check()</text><text x="433" y="396" class="small">reject if stock check fails</text>

  <path d="M541 404 V430 H420" class="flow"/>
  <circle cx="395" cy="430" r="13" class="n"/><text x="395" y="430" class="ntext">3</text>
  <rect x="88" y="414" width="300" height="48" rx="8" class="box"/>
  <text x="103" y="436" class="label">pricing.computeTotals(items, code)</text><text x="103" y="454" class="small">coupons.calculateDiscount() · tax.getRateForItem()</text>
  <path d="M388 438 H418" class="flow"/>
  <rect x="418" y="414" width="245" height="48" rx="8" class="ticket"/>
  <text x="433" y="436" class="label ticketText">GST slabs via lib/tax.js</text><text x="433" y="454" class="small ticketText">HSN rate · post-discount tax</text>

  <path d="M540 462 V486 H420" class="flow"/>
  <circle cx="395" cy="486" r="13" class="n"/><text x="395" y="486" class="ntext">4</text>
  <rect x="88" y="470" width="300" height="48" rx="8" class="box"/>
  <text x="103" y="492" class="label">ledger.chargeOrderToKhata()</text><text x="103" y="510" class="small">only for Khata; checks limit and updates balance</text>
  <path d="M388 494 H418" class="flow"/>
  <rect x="418" y="470" width="245" height="48" rx="8" class="box"/>
  <text x="433" y="492" class="label">inventory.reserve()</text><text x="433" y="510" class="small">decrement product stock</text>

  <path d="M540 518 V544 H420" class="flow"/>
  <circle cx="395" cy="544" r="13" class="n"/><text x="395" y="544" class="ntext">5</text>
  <rect x="88" y="528" width="300" height="48" rx="8" class="box"/>
  <text x="103" y="550" class="label">orders.add(db, orderData)</text><text x="103" y="568" class="small">assign ID · append saved order fields</text>
  <path d="M388 552 H418" class="flow"/>
  <rect x="418" y="528" width="245" height="48" rx="8" class="box"/>
  <text x="433" y="550" class="label">store.appendAudit() + write()</text><text x="433" y="568" class="small">persist whole db.json</text>

  <path d="M540 576 V602 H420" class="flow"/>
  <circle cx="395" cy="602" r="13" class="n"/><text x="395" y="602" class="ntext">6</text>
  <rect x="88" y="586" width="300" height="48" rx="8" class="box"/>
  <text x="103" y="608" class="label">data/db.json</text><text x="103" y="626" class="small">product stock · customer totals · order · audit</text>
  <path d="M388 610 H418" class="flow"/>
  <rect x="418" y="586" width="245" height="48" rx="8" class="box"/>
  <text x="433" y="608" class="label">HTTP 201 · order JSON</text><text x="433" y="626" class="small">returned to the browser UI</text>

  <!-- Architecture links -->
  <path d="M690 210 H714 V199 H738" class="flow"/>
  <path d="M690 210 H720 V368 H738" class="link"/>
  <path d="M690 210 H726 V311 H738" class="link"/>
  <path d="M690 210 H732 V254 H738" class="link"/>
  <path d="M953 142 H990" class="link"/>
  <path d="M953 142 H972 V161 H990" class="link dash"/>
  <path d="M953 199 H973 V294 H990" class="link"/>
  <path d="M953 368 H971 V540 H953" class="link"/>
  <path d="M953 540 H974 V600 H953" class="link dash"/>
  <path d="M953 600 H974 V661 H953" class="link dash"/>
  <path d="M450 225 H476 V600 H738" class="link dash"/>
  <text x="979" y="398" class="small" transform="rotate(90 979 398)">read / write through lib/store.js</text>

  <!-- Legend -->
  <rect x="990" y="443" width="180" height="144" rx="10" class="soft"/>
  <text x="1006" y="470" class="label">Legend</text>
  <rect x="1007" y="484" width="18" height="18" rx="3" class="ticket"/><text x="1035" y="498" class="body">ticket-highlighted modules</text>
  <path d="M1007 526 H1030" class="flow"/><text x="1041" y="530" class="body">order execution flow</text>
  <path d="M1007 556 H1030" class="link dash"/><text x="1041" y="560" class="body">module dependency / data path</text>
  <text x="990" y="625" class="small">Solid blue path carries the</text>
  <text x="990" y="644" class="small">numbered order flow above.</text>
  <text x="32" y="742" class="small">Ticket highlight includes lib/tax.js because lib/pricing.js calls tax.getRateForItem() and tax.splitCgstSgst().</text>
  <text x="32" y="766" class="small">Diagram reflects repository structure and code references; dotted links indicate shared dependencies or read/write paths.</text>
</svg>
